name: CI

permissions:
  contents: read

# 同一分支的重复推送取消旧运行，避免排队浪费 runner 分钟。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # 覆盖率门槛按解释器分级：Python 3.12+ 的覆盖率追踪走 sys.monitoring（PEP 669），
        # 计数精确；3.11 仍用 sys.settrace，对「在 async 上下文管理器里创建并取消后台任务
        # 之后的同协程行」会丢归属——同一个提交、同一批 569 个测试（0 失败）下，
        # 3.11 报 96.8%、3.13/3.14 报 97.5%。注意这不是真实缺口：直接调用 /chat 路由的
        # 测试在 3.11 上同样通过，而它断言 `reply == "ok"`，只有执行了那些「未覆盖」的
        # 行才可能成立。因此 3.11 用 96.5 的下限，其余解释器保持 97。
        include:
          - python-version: "3.11"
            cov-fail-under: "96.5"
          - python-version: "3.12"
            cov-fail-under: "97"
          - python-version: "3.13"
            cov-fail-under: "97"
          - python-version: "3.14"
            cov-fail-under: "97"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # GitHub Actions 自带的 setuptools 79.0.1 含 CVE（PYSEC-2026-3447，修复版 83.0.0），
          # pip-audit 会审计环境中的全部包；升级到修复版本避免 CI 误报。
          pip install --upgrade "setuptools>=83.0.0"

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Type-check application
        run: mypy app/

      - name: Run tests
        # --cov-fail-under 覆盖 pyproject 里的全局门槛，按解释器取矩阵值（见上方注释）
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml --junitxml=report.xml --cov-fail-under=${{ matrix.cov-fail-under }}

      - name: Upload test artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-artifacts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            report.xml
          retention-days: 14
          if-no-files-found: ignore

      - name: Security audit (pip-audit)
        # 依赖漏洞扫描：检测 PyPI 已知 CVE，有漏洞即失败阻断合并。
        # --skip-editable：本地可编辑安装包（github-issue-agent）不在 PyPI 上
        # 无法审计；配合非 strict 模式，跳过项仅作提示，不再恒 exit 1。
        run: pip-audit --skip-editable

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build -t issue-agent .

      # 只 build 不 run 的 CI 无法发现"镜像能构建但开机即坏"（例如非 root 用户
      # 写不了数据目录）。这里真实启动容器、探活并以 appuser 身份验证数据目录可写。
      - name: Smoke-test the container
        run: |
          set -euxo pipefail
          CONTAINER=issue-agent-smoke
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          # 无论后续哪一步失败都清理容器（失败时日志已在上面打印）。
          trap 'docker rm -f "$CONTAINER" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$CONTAINER" \
            -p 18000:8000 \
            -e SESSION_DB_PATH=/app/data/sessions.db \
            -e OPENAI_API_KEY=test-key \
            issue-agent

          # 轮询 /health，直到 status=ok；超时则打印容器日志并失败（不调用真实 LLM）。
          ok=0
          for attempt in $(seq 1 30); do
            body=$(curl -fsS http://127.0.0.1:18000/health || true)
            echo "attempt ${attempt}: ${body}"
            if echo "$body" | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::container did not report status=ok within 60s"
            docker logs "$CONTAINER" || true
            exit 1
          fi

          # 数据目录可写性：非 root 的 appuser 必须能落库（回归防护）。
          docker exec "$CONTAINER" python -c "import pathlib; p=pathlib.Path('/app/data/x'); p.write_text('ok'); print('data dir writable:', p.read_text())"
          docker exec "$CONTAINER" sh -c "id -u; ls -ld /app/data"

          docker logs "$CONTAINER" || true
          # 容器由上面的 EXIT trap 统一清理。

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Run browser regression tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
